<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />

  <!-- PWA: Viewport optimizat pentru mobil (fără zoom la dublu-click) -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

  <title>Social Spark AI - Stop Sounding Like AI | Clone Your Brand Voice</title>
  <meta name="description"
    content="The only AI workspace that remembers your brand DNA and creates consistent, on-brand content. Better than ChatGPT. Smarter than Canva. Try free for 5 days." />
  <meta name="keywords"
    content="AI content creation, brand voice, social media AI, content marketing, ChatGPT alternative, brand consistency" />

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Social Spark AI - Clone Your Brand Voice" />
  <meta property="og:description"
    content="Generate viral content that sounds like YOU, not generic AI. Voice DNA technology + Real-time data + Remix Mode." />
  <meta property="og:image" content="/og-image.png" />
  <meta property="og:url" content="https://socialspark.ai" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Social Spark AI - Clone Your Brand Voice" />
  <meta name="twitter:description" content="AI content that sounds like you, not ChatGPT." />
  <meta name="twitter:image" content="/twitter-card.png" />

  <!-- PWA: Setări pentru "Add to Home Screen" -->
  <link rel="icon" type="image/png" href="/social-spark-logo.png" />
  <meta name="theme-color" content="#0F172A" />
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="/manifest.json">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'brand-primary': '#3B82F6',   /* Electric Blue */
            'brand-secondary': '#06B6D4', /* Cyber Cyan */
            'brand-bg-dark': '#0F172A',   /* Slate 900 */
            'brand-bg-light': '#1E293B',  /* Slate 800 */
            'brand-text': '#F8FAFC',      /* Slate 50 */
            'brand-text-secondary': '#94A3B8', /* Slate 400 */
          }
        }
      }
    }
  </script>

  <!-- Import Maps (Păstrate intacte) -->
  <script type="importmap">
    {
      "imports": {
        "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
        "react/": "https://aistudiocdn.com/react@^19.2.0/",
        "react": "https://aistudiocdn.com/react@^19.2.0",
        "@google/genai": "https://aistudiocdn.com/@google/genai@^1.29.1",
        "firebase/app": "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js",
        "firebase/auth": "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js",
        "firebase/firestore": "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js",
        "firebase/": "https://aistudiocdn.com/firebase@^12.6.0/",
        "vite": "https://aistudiocdn.com/vite@^7.2.4",
        "@vitejs/plugin-react": "https://aistudiocdn.com/@vitejs/plugin-react@^5.1.1",
        "path": "https://aistudiocdn.com/path@^0.12.7"
      }
    }
    </script>
</head>

<body class="bg-brand-bg-dark">
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
